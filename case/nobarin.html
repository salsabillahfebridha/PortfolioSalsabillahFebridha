<section id="context">
  <h2>The brief</h2>
  <p>Nobarin was designed for the Mobile UI/UX Competition 2024 — a national competition with 122
    teams from 13 provinces. We took on video-on-demand, which is a crowded category, and that was
    the point: in a crowded category the only way to win is to be clear about who you're for.</p>
</section>

<section id="problem">
  <h2>The problem</h2>
  <p>Legal streaming in Indonesia competes with free piracy, and it usually competes on the wrong
    axis. Pirated sources aren't winning on quality — they're winning on access and price. If a
    legal platform is harder to get into, harder to manage, or priced past what its audience can
    justify monthly, the moral argument doesn't hold the user.</p>
  <div class="callout">
    <p>We set three constraints and refused to trade them off: easy to access, easy to manage,
      affordable enough that staying legal isn't a sacrifice.</p>
  </div>
</section>

<section id="approach">
  <h2>How we worked</h2>
  <ol>
    <li><strong>Constraints before features.</strong> Every proposed feature had to serve access,
      manageability or affordability — anything that only served novelty was cut.</li>
    <li><strong>Designed the management layer properly.</strong> Most VOD design effort goes into
      discovery; we gave equal weight to what happens after you subscribe.</li>
    <li><strong>Built a clickable prototype in Figma</strong> so judges could use it rather than
      read about it.</li>
  </ol>
</section>

<section id="design">
  <h2>What the product does</h2>
  <p>Nobarin is a VOD-based application built around the three constraints above — a
    movie-watching platform that's straightforward to access, straightforward to manage, priced for
    its audience, and legal.</p>
