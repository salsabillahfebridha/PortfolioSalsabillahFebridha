<section id="context">
  <h2>The brief</h2>
  <p>Ukirama builds ERP software for Indonesian businesses. For six months I sat inside that
    product team as a UI/UX design intern, and the work split into three streams that kept feeding
    each other: the public marketing site, two feature modules inside the ERP itself, and the
    system that was supposed to hold both together.</p>
  <p>Nothing here was a mockup that lived in a folder. Everything I designed was headed for a
    product with existing users, an existing codebase, and existing decisions I had to either work
    with or argue against.</p>
</section>

<section id="problem">
  <h2>The problem</h2>
  <p>Two things were true at once. The marketing site wasn't doing enough to explain what the
    product actually offered — a visitor had to work to understand the difference between plans,
    what a template gave them, or whether anyone like them already used it. And underneath, the
    design system had drifted. Components had been copied, tweaked and re-copied until the same
    element existed in several slightly different versions, which is the point at which a design
    system stops saving anyone time and starts costing it.</p>
  <div class="callout">
    <p>A marketing site can't be clearer than the system it's assembled from. Fixing the pages
      without fixing the components would have bought a few months at most.</p>
  </div>
</section>

<section id="approach">
  <h2>How I worked</h2>
  <ol>
    <li><strong>Competitor research first.</strong> Before drawing anything, I looked at how
      comparable products structured their comparison, pricing and template pages — what they made
      easy to find, and what they buried.</li>
    <li><strong>Design, then test the attention.</strong> Rather than defending layouts on taste,
      I ran AI-based user attention testing on them, so conversations with stakeholders were about
      where the eye actually went rather than where we each thought it should.</li>
    <li><strong>Wireframe the system, not the page.</strong> For the Sanity CMS page builder I
      worked at the component level — 18+ reusable blocks a content editor could assemble without
      needing a designer for every new page.</li>
    <li><strong>Audit at scale.</strong> Two dedicated consistency projects, covering 1,000+
      component visibility, to bring the drifted variants back to one source of truth.</li>
    <li><strong>Close the loop with UAT.</strong> 20+ user acceptance tests across ERP and website
      features, because a design isn't finished when it's handed over — it's finished when someone
      who didn't design it can complete the task.</li>
  </ol>
</section>

<section id="design">
  <h2>What I designed</h2>
  <p>Across the engagement: <strong>15+ pages</strong> for the Ukirama site, including a comparison
    page, a template page and a testimonial section, plus <strong>two ERP feature modules</strong>
    and the wireframe set for the CMS page builder.</p>
  <ul>
    <li><strong>Comparison page</strong> — so the choice between options is a scan, not a study.</li>
    <li><strong>Template page</strong> — showing what you get before you commit to getting it.</li>
    <li><strong>Testimonial section</strong> — proof from people who look like the reader.</li>
    <li><strong>Page-builder component library</strong> — 18+ blocks, documented so non-designers
      can build a page that still looks like the brand.</li>
    <li><strong>ERP feature modules</strong> — interface work inside the product, where the
      constraint is existing patterns rather than a blank canvas.</li>
  </ul>
