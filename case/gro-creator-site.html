      <div class="prose">
  <section id="context">
    <h2>The brief</h2>
    <p>Gro is a creator platform, and a creator platform is really three products wearing one name.
      Creators need somewhere to do the work. Agencies need somewhere to manage the creators they
      represent. Admins need somewhere to keep the whole thing running. I spent six months at
      Paragon Technology and Innovation designing all three.</p>
    <p>This was product design against a release schedule — not a concept deck. Work shipped, users
      hit it, and the next release was already being scoped.</p>
  </section>

  <section id="problem">
    <h2>The problem</h2>
    <p>Three portals built by the same team will still drift apart if nothing holds them together.
      Each audience has genuinely different needs, so each screen has a reason to be different — and
      those reasons accumulate until a creator and an admin are effectively using two products that
      happen to share a logo.</p>
    <p>The second problem was evidence. Shipping five-plus releases in six months means design
      decisions get made fast, and fast decisions default to whoever argues best unless something
      external settles them.</p>
    <div class="callout">
      <p>Consistency isn't a style preference at this scale — it's the only thing keeping three
        portals recognisably one product. And a design decision without a test behind it is just a
        preference with better formatting.</p>
    </div>
  </section>

  <section id="approach">
    <h2>How I worked</h2>
    <ol>
      <li><strong>Built the system, not just the screens.</strong> I contributed to a design system
        carrying 150+ colour tokens plus the documentation that makes tokens usable by someone who
        wasn't in the room when they were named.</li>
      <li><strong>Tested with real users, repeatedly.</strong> 10+ usability testing sessions with
        both internal and external users, so design decisions were settled by observation rather
        than by opinion.</li>
      <li><strong>Measured satisfaction at scale.</strong> I ran CSAT measurement for the creator
        site targeting 500+ users, to get a read on satisfaction and usability broader than any
        moderated session can give.</li>
      <li><strong>Researched AI-assisted workflows with the front-end team</strong> — looking at
        where the technology could genuinely take work off a creator's hands rather than where it
        could be advertised.</li>
      <li><strong>Ran UI/UX quality checks before release.</strong> The last gate before shipping:
        consistency and usability verified on the build, not on the Figma file.</li>
    </ol>
  </section>

  <section id="design">
    <h2>What I designed</h2>
    <p>Across six months: <strong>20+ pages</strong> spanning the admin, agency and creator portals,
      supporting <strong>5+ releases</strong> as the design lead on those flows.</p>
    <ul>
      <li><strong>Creator portal</strong> — the daily working surface, where the volume of use lives
        and every extra click compounds.</li>
      <li><strong>Agency portal</strong> — managing a roster rather than doing the work, which is a
        different job and needed a different information hierarchy.</li>
      <li><strong>Admin portal</strong> — oversight and control, designed for density, because the
        people here are looking at everything at once.</li>
      <li><strong>Design system contribution</strong> — 150+ colour tokens and the documentation
        around them, so the three portals stay one product as the team grows.</li>
    </ul>

    <p>The part I'd point at is the shift in how decisions got made. Usability sessions and a CSAT
