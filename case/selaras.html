<section id="context">
  <h2>The brief</h2>
  <p>Selaras was a group entry for a national UI/UX competition. The category was mental health,
    which is a category where a badly designed product does real harm — so the constraint we worked
    under was not "make it beautiful" but "make it safe to open on a bad day".</p>
</section>

<section id="problem">
  <h2>The problem</h2>
  <p>Between noticing you're not okay and getting professional help sits a long, discouraging gap.
    Finding a psychologist, affording one, and admitting out loud that you need one are three
    separate barriers, and most people stall at the first. Meanwhile the everyday habits that
    actually move well-being — sleep, reflection, naming what you feel — go untracked because
    nothing makes them easy.</p>
  <div class="callout">
    <p>A mental-health app has to be useful on the days someone won't book an appointment, or it
      won't be open on the day they would.</p>
  </div>
</section>

<section id="approach">
  <h2>How we worked</h2>
  <ol>
    <li><strong>Ran it through Design Thinking</strong> — empathise, define, ideate, prototype,
      test — so the feature set came out of the problem rather than out of a brainstorm.</li>
    <li><strong>Designed for the low-energy state first.</strong> The entry points assume a user
      with very little capacity, not a motivated one.</li>
    <li><strong>Layered the support</strong> — self-service journaling, then AI conversation, then
      a professional — so escalation is a small step rather than a leap.</li>
    <li><strong>Tested the flows in Maze</strong> and prototyped in Figma to check the emotional
      pacing as well as the navigation.</li>
  </ol>
</section>

<section id="design">
  <h2>What the product does</h2>
  <ul>
    <li><strong>Self-journaling</strong> — a daily check-in with prompts (what I'm grateful for,
      what I'm proud of, today's highlight) that lower the cost of starting to write.</li>
    <li><strong>Emotion tracking</strong> — a simple daily rating that turns feelings into a
      pattern you can see rather than a mood you can't explain.</li>
    <li><strong>AI conversation</strong> — a companion for the hours when no one is available and
      the thought needs somewhere to go.</li>
    <li><strong>Professional consultation</strong> — licensed psychologists and psychiatrists,
      filterable by availability, gender and price, with the cost shown up front.</li>
    <li><strong>Lifestyle tracking</strong> — guided meditation and routine-building, so the app
      supports the habits and not only the crises.</li>
  </ul>
