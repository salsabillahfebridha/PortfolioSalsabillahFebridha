<section id="context">
  <h2>The brief</h2>
  <p>Paw Link was designed for INSPACE 2024. The premise was connected pet care — an app paired
    with a smart collar — and the design question was what a device should do with information its
    owner can't interpret.</p>
</section>

<section id="problem">
  <h2>The problem</h2>
  <p>A pet can't tell you what's wrong, so owners work from guesswork and hindsight. Connected
    collars solve the sensing half of that and then usually stop, handing back a dashboard of
    numbers. A heart-rate graph doesn't tell someone whether to worry.</p>
  <div class="callout">
    <p>Monitoring isn't the product. Knowing what to do next is the product.</p>
  </div>
</section>

<section id="approach">
  <h2>How I worked</h2>
  <ol>
    <li><strong>Started from the owner's question</strong> — "is my pet okay?" — and worked
      backwards to what the collar would need to sense to answer it.</li>
    <li><strong>Used IoT and AI as translation, not decoration.</strong> The sensor supplies the
      signal; the AI layer turns it into a statement in plain language.</li>
    <li><strong>Kept the interface intuitive under stress</strong>, since the moments that matter
      most are the ones where the owner is already worried.</li>
  </ol>
</section>

<section id="design">
  <h2>What the product does</h2>
  <ul>
    <li><strong>Collar pairing and live monitoring</strong> — the connection between device and app,
      designed so setup doesn't need a manual.</li>
    <li><strong>Needs, not numbers</strong> — readings interpreted into what the pet needs, so the
      owner gets an answer rather than a chart.</li>
    <li><strong>IoT + AI features</strong> — the sensing and interpretation layers that make the
      rest of the app possible.</li>
  </ul>
