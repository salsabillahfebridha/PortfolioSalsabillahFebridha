<section id="context">
  <h2>The brief</h2>
  <p>Jelajah was built for Technotainment 2024 and reached the final — top 5 out of 38 teams from
    18 universities. The subject was Indonesian cultural heritage, and the question we chose to
    answer was why a country this rich in it struggles to make people want to visit.</p>
</section>

<section id="problem">
  <h2>The problem</h2>
  <p>Cultural tourism destinations are, for most people, a plaque and a paragraph. The history is
    real but it stays abstract — you're standing in the place and still can't picture what happened
    there. Preservation efforts usually respond by adding more information, which is the opposite
    of what's missing.</p>
  <div class="callout">
    <p>The gap isn't information. It's imagination — and that's a design problem, not an archival
      one.</p>
  </div>
</section>

<section id="approach">
  <h2>How we worked</h2>
  <ol>
    <li><strong>Treated exploration as the core loop.</strong> The app's job is to get someone from
      curiosity to standing in front of something, so discovery and navigation carried the weight.</li>
    <li><strong>Used AR where it earns its keep.</strong> Augmented Reality is easy to bolt on
      badly; we scoped it to the moment where it does something a photo can't — reconstructing what
      you're looking at, in place.</li>
    <li><strong>Prototyped the full journey in Figma</strong> and pitched it against the
      competition's preservation criteria.</li>
  </ol>
</section>

<section id="design">
  <h2>What the product does</h2>
  <ul>
    <li><strong>Destination exploration</strong> — a browsable set of cultural tourism destinations
      across Indonesia, built to be wandered through rather than searched.</li>
    <li><strong>Augmented Reality layer</strong> — heritage rendered over the real site, so the
      history is something you stand inside rather than read about.</li>
    <li><strong>Preservation framing</strong> — the app is positioned as a way to keep the culture
      in circulation, not merely to catalogue it.</li>
  </ul>
