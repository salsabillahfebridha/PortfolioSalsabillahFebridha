<section id="context">
  <h2>The brief</h2>
  <p>Notes was the final project for the UI/UX Basic Study Club at KSM Android, and it's the one on
    this site that started closest to home. The idea didn't come from a market gap — it came from
    watching a lot of friends lose track of their own workload.</p>
</section>

<section id="problem">
  <h2>The problem</h2>
  <p>Students already own the tools. They have a notes app, a calendar, a group chat where
    deadlines get mentioned once, and a paper planner they stopped updating in week three. The
    failure isn't a missing feature — it's that the record of what needs doing is scattered across
    four places, so nothing is ever the complete picture and things fall through the gap between.</p>
  <div class="callout">
    <p>People weren't asking for a better notes app. They were asking to stop having four.</p>
  </div>
</section>

<section id="approach">
  <h2>How I worked — as UX researcher</h2>
  <ol>
    <li><strong>Started from the observed behaviour</strong> of the people around me rather than a
      persona invented to justify a feature list.</li>
    <li><strong>Modelled the product on objects people already trust</strong> — a book, a binder, a
      daily planner — so the mental model needed no teaching.</li>
    <li><strong>Mapped the flows in Draw.io</strong> before any interface existed, to check the
      structure held on its own.</li>
    <li><strong>Handed research into design</strong> and stayed close enough to defend why each
      requirement was there.</li>
  </ol>
</section>

<section id="design">
  <h2>What the product does</h2>
  <ul>
    <li><strong>Notes</strong> — free capture, for the thought that arrives before the task does.</li>
    <li><strong>Scheduling</strong> — activities placed on a day, so intention becomes a commitment.</li>
    <li><strong>Progress tracking</strong> — the state of each task visible, so nothing quietly
      falls off the list.</li>
  </ul>
